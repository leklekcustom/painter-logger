<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>LeklekCustom · บันทึกงาน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --ink:#1a1a1a;--ink2:#555;--ink3:#999;--border:#e0e0e0;
  --bg:#f7f6f3;--white:#fff;--accent:#ff5533;
  --green:#1a7a4a;--green-bg:#edf7f1;
  --pill-bg:#f0ede8;--radius:14px;--shadow:0 1px 4px rgba(0,0,0,0.08);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
html,body{height:100%;background:var(--bg);font-family:'Sarabun',sans-serif;font-size:16px;color:var(--ink)}

/* Layout */
.screen{display:none;flex-direction:column;height:100dvh;overflow:hidden}
.screen.active{display:flex}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;background:var(--bg);flex-shrink:0;border-bottom:1px solid var(--border)}
.topbar-logo{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:500;color:var(--ink3);letter-spacing:0.08em;text-transform:uppercase}
.topbar-logo span{color:var(--accent)}
.topbar-action{font-size:14px;font-weight:600;color:var(--accent);background:none;border:none;font-family:'Sarabun',sans-serif;cursor:pointer;padding:4px 0}
.topbar-back{font-size:15px;color:var(--ink3);background:none;border:none;font-family:'Sarabun',sans-serif;cursor:pointer;display:flex;align-items:center;gap:4px}
.scroll-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px calc(16px + var(--safe-bottom))}

/* Home */
.new-btn{width:100%;padding:15px;border-radius:12px;background:var(--accent);color:#fff;font-family:'Sarabun',sans-serif;font-size:16px;font-weight:600;border:none;cursor:pointer;margin-bottom:14px;letter-spacing:0.01em}
.tabs{display:flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--pill-bg);margin-bottom:14px}
.tab{flex:1;padding:10px;font-size:14px;font-family:'Sarabun',sans-serif;border:none;background:transparent;cursor:pointer;color:var(--ink3);font-weight:500}
.tab.active{background:var(--ink);color:#fff}
.order-list{display:flex;flex-direction:column;gap:10px}
.order-card{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--white);border-radius:12px;border:1px solid var(--border);cursor:pointer;box-shadow:var(--shadow)}
.order-thumb{width:48px;height:48px;border-radius:8px;background:var(--pill-bg);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:22px}
.order-thumb img{width:100%;height:100%;object-fit:cover}
.order-info{flex:1;min-width:0}
.order-name{font-size:15px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.order-meta{font-size:12px;color:var(--ink3);font-family:'IBM Plex Mono',monospace;margin-top:2px}
.order-arrow{color:var(--ink3);font-size:18px;flex-shrink:0}
.empty{text-align:center;padding:3rem 1rem;color:var(--ink3);font-size:14px}
.archived-bar{background:var(--green-bg);border-radius:8px;padding:8px 12px;font-size:13px;color:var(--green);font-weight:500;text-align:center;margin-bottom:10px}

/* Form */
.field-group{background:var(--white);border-radius:var(--radius);border:1px solid var(--border);padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.field-label{font-size:11px;font-weight:600;letter-spacing:0.07em;text-transform:uppercase;color:var(--ink3);margin-bottom:8px}
.field-input{width:100%;border:1px solid var(--border);border-radius:10px;padding:12px 14px;font-size:16px;font-family:'Sarabun',sans-serif;background:var(--white);color:var(--ink);outline:none;-webkit-appearance:none}
.field-input:focus{border-color:#aaa}
.photo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.photo-slot{aspect-ratio:1;border-radius:10px;border:1.5px dashed var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;overflow:hidden;background:var(--bg)}
.photo-slot img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;border-radius:8px}
.photo-slot .plus{font-size:22px;color:var(--ink3)}
.photo-slot .del-btn{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,0.6);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2}
input[type=file]{display:none}

/* Log entry */
.log-entries{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.log-entry{background:var(--bg);border-radius:12px;padding:12px;position:relative;border:1px solid var(--border)}
.log-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.log-row:last-child{margin-bottom:0}
.log-field-label{font-size:11px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink3);margin-bottom:5px}
.log-select,.log-text{width:100%;border:1px solid var(--border);border-radius:9px;padding:11px 10px;font-size:15px;font-family:'Sarabun',sans-serif;background:var(--white);color:var(--ink);outline:none;-webkit-appearance:none;appearance:none}
.log-num{width:100%;border:1px solid var(--border);border-radius:9px;padding:11px 10px;font-size:18px;font-family:'IBM Plex Mono',monospace;font-weight:500;background:var(--white);color:var(--ink);outline:none;text-align:center;-webkit-appearance:none}
.time-unit{font-size:11px;color:var(--ink3);text-align:center;margin-top:4px}
.del-entry{position:absolute;top:10px;right:10px;width:24px;height:24px;border-radius:50%;background:transparent;border:1px solid var(--border);color:var(--ink3);font-size:14px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.add-entry-btn{width:100%;padding:12px;border:1.5px dashed var(--border);border-radius:10px;background:transparent;font-family:'Sarabun',sans-serif;font-size:15px;color:var(--ink3);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}

/* Save button sticky */
.save-bar{padding:12px 16px calc(12px + var(--safe-bottom));background:var(--bg);border-top:1px solid var(--border);flex-shrink:0}
.save-btn{width:100%;padding:16px;border-radius:12px;background:var(--ink);color:#fff;font-family:'Sarabun',sans-serif;font-size:17px;font-weight:600;border:none;cursor:pointer}
.save-btn:disabled{opacity:0.5}

/* Detail */
.detail-name{font-size:20px;font-weight:700;color:var(--ink);margin-bottom:12px}
.detail-photos{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
.detail-photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}
.log-row-detail{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--border);gap:8px}
.log-row-detail:last-child{border-bottom:none}
.log-info{flex:1;min-width:0}
.log-date-txt{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink3);margin-bottom:2px}
.log-main-txt{font-size:14px;color:var(--ink);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;background:var(--pill-bg);border-radius:99px;padding:2px 9px;font-size:12px;color:var(--ink2);font-weight:500}
.log-hrs{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:500;color:var(--ink);white-space:nowrap}
.total-bar{display:flex;justify-content:space-between;align-items:center;padding:14px;background:var(--ink);border-radius:12px;margin-top:14px;margin-bottom:10px}
.total-bar span{color:#fff;font-size:14px}
.total-bar strong{color:#fff;font-size:20px;font-family:'IBM Plex Mono',monospace}
.done-badge{display:inline-flex;align-items:center;gap:4px;background:var(--green-bg);color:var(--green);border-radius:99px;padding:3px 12px;font-size:12px;font-weight:600;margin-bottom:10px}
.btn-done{width:100%;padding:14px;border-radius:12px;border:2px solid var(--green);background:transparent;color:var(--green);font-family:'Sarabun',sans-serif;font-size:16px;font-weight:600;cursor:pointer}
.btn-done.done-active{background:var(--green);color:#fff}

/* Select arrow */
.select-wrap{position:relative}
.select-wrap::after{content:'▾';position:absolute;right:10px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--ink3);font-size:12px}
.select-wrap select{padding-right:28px}
</style>
</head>
<body>

<!-- HOME -->
<div class="screen active" id="screen-home">
  <div class="topbar">
    <div class="topbar-logo">Leklek<span>Custom</span> · บันทึกงาน</div>
  </div>
  <div class="scroll-body">
    <button class="new-btn" onclick="showForm(null)">+ บันทึกออเดอร์ใหม่</button>
    <div class="tabs">
      <button class="tab active" onclick="switchTab('active')">กำลังทำ</button>
      <button class="tab" onclick="switchTab('done')">เสร็จแล้ว</button>
    </div>
    <div id="order-list"></div>
  </div>
</div>

<!-- FORM -->
<div class="screen" id="screen-form">
  <div class="topbar">
    <button class="topbar-back" onclick="goHome()">← กลับ</button>
    <div class="topbar-logo">บันทึกงาน</div>
    <div style="width:48px"></div>
  </div>
  <div class="scroll-body" id="form-scroll">
    <div class="field-group">
      <div class="field-label">ชื่อออเดอร์ / ลาย</div>
      <input class="field-input" id="order-name" placeholder="เช่น Nike Air Max ลายหมี...">
    </div>
    <div class="field-group">
      <div class="field-label">รูปออกแบบ (1–4 รูป)</div>
      <div class="photo-grid" id="photo-grid">
        <label class="photo-slot" id="slot-0"><span class="plus">+</span><input type="file" accept="image/*" onchange="addPhoto(this,0)"></label>
        <label class="photo-slot" id="slot-1" style="display:none"><span class="plus">+</span><input type="file" accept="image/*" onchange="addPhoto(this,1)"></label>
        <label class="photo-slot" id="slot-2" style="display:none"><span class="plus">+</span><input type="file" accept="image/*" onchange="addPhoto(this,2)"></label>
        <label class="photo-slot" id="slot-3" style="display:none"><span class="plus">+</span><input type="file" accept="image/*" onchange="addPhoto(this,3)"></label>
      </div>
    </div>
    <div class="field-group">
      <div class="field-label">บันทึกงานรายวัน</div>
      <div class="log-entries" id="log-list"></div>
      <button class="add-entry-btn" onclick="addEntry()">+ เพิ่มรายการ</button>
    </div>
  </div>
  <div class="save-bar">
    <button class="save-btn" id="save-btn" onclick="saveOrder()">บันทึก</button>
  </div>
</div>

<!-- DETAIL -->
<div class="screen" id="screen-detail">
  <div class="topbar">
    <button class="topbar-back" onclick="goHome()">← กลับ</button>
    <div class="topbar-logo">รายละเอียด</div>
    <button class="topbar-action" onclick="editOrder()">แก้ไข ✏️</button>
  </div>
  <div class="scroll-body">
    <div id="done-badge-area"></div>
    <div class="detail-name" id="detail-name"></div>
    <div class="detail-photos" id="detail-photos"></div>
    <div id="detail-logs"></div>
    <div class="total-bar">
      <span>รวมทั้งหมด</span>
      <strong id="detail-total">0 ชม.</strong>
    </div>
    <button class="btn-done" id="btn-done-toggle" onclick="toggleDone()">✓ งานนี้เสร็จแล้ว</button>
  </div>
</div>

<script>
const STAFF=['มิกซ์','แยม','ก้อง','เฟิส','เฟอร์'];
const TASKS=['เพ้นท์','ออกแบบ','พ่นสี','แปะเทป','แปะสตก.','ตัดสตก.','ผสมสี','ถ่ายรูป','ถ่ายวิดีโอ','เคลือบ','ลงข้อมูล','แก้สี','อื่นๆ'];
const SHEET_URL='https://script.google.com/macros/s/AKfycbz75t1VdwmIIpoYQ6KXr5GwVnSG2AdWp5kW-iQJf7ehl8avqn_5x7m7CB0rF0hLYMl9/exec';

let orders=[],photos=[null,null,null,null],currentId=null,activeTab='active';

function today(){const d=new Date();return`${d.getDate().toString().padStart(2,'0')}/${(d.getMonth()+1).toString().padStart(2,'0')}/${d.getFullYear()}`;}

async function loadOrders(){
  try{const r=await window.storage.get('llc_orders2');orders=r?JSON.parse(r.value):[];}catch(e){orders=[];}
  renderHome();
}
async function saveOrders(){try{await window.storage.set('llc_orders2',JSON.stringify(orders));}catch(e){}}

function renderHome(){
  const list=document.getElementById('order-list');
  const filtered=orders.filter(o=>activeTab==='done'?o.done:!o.done);
  if(!filtered.length){
    list.innerHTML=`<div class="empty">${activeTab==='done'?'ยังไม่มีออเดอร์ที่เสร็จ':'ยังไม่มีออเดอร์'}</div>`;
    return;
  }
  let html='';
  if(activeTab==='done') html+=`<div class="archived-bar">เสร็จแล้ว ${filtered.length} ออเดอร์</div>`;
  html+=`<div class="order-list">${filtered.map(orderCard).join('')}</div>`;
  list.innerHTML=html;
}

function orderCard(o){
  const totalMin=(o.logs||[]).reduce((s,l)=>s+(parseInt(l.hours)||0)*60+(parseInt(l.mins)||0),0);
  const h=Math.floor(totalMin/60),m=totalMin%60;
  const timeStr=h>0&&m>0?`${h}ชม. ${m}น.`:h>0?`${h}ชม.`:`${m}น.`;
  const thumb=o.photos&&o.photos[0]?`<img src="${o.photos[0]}">`:'👟';
  return `<div class="order-card" onclick="showDetail('${o.id}')">
    <div class="order-thumb">${thumb}</div>
    <div class="order-info">
      <div class="order-name">${o.done?'✓ ':''}${o.name||'ออเดอร์ไม่มีชื่อ'}</div>
      <div class="order-meta">${timeStr} · ${(o.logs||[]).length} รายการ</div>
    </div>
    <div class="order-arrow">›</div>
  </div>`;
}

function switchTab(t){
  activeTab=t;
  document.querySelectorAll('.tab').forEach((el,i)=>el.classList.toggle('active',['active','done'][i]===t));
  renderHome();
}

function showForm(id){
  currentId=id;photos=[null,null,null,null];
  document.getElementById('log-list').innerHTML='';
  document.getElementById('order-name').value='';
  for(let i=0;i<4;i++){
    const sl=document.getElementById('slot-'+i);
    sl.style.display=i===0?'flex':'none';
    sl.querySelector('img')&&sl.querySelector('img').remove();
    sl.querySelector('.del-btn')&&sl.querySelector('.del-btn').remove();
    sl.querySelector('.plus').style.display='';
  }
  if(id){
    const o=orders.find(x=>x.id===id);
    if(o){
      document.getElementById('order-name').value=o.name||'';
      photos=[...(o.photos||[null,null,null,null])];
      photos.forEach((p,i)=>{if(p)renderPhotoSlot(i,p);});
      (o.logs||[]).forEach(l=>addEntry(l));
    }
  } else {addEntry();}
  document.getElementById('form-scroll').scrollTop=0;
  show('form');
}

function editOrder(){showForm(currentId);}

function addPhoto(input,idx){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{photos[idx]=e.target.result;renderPhotoSlot(idx,e.target.result);};
  reader.readAsDataURL(file);
}

function renderPhotoSlot(idx,src){
  const sl=document.getElementById('slot-'+idx);
  let img=sl.querySelector('img');
  if(!img){img=document.createElement('img');sl.appendChild(img);}
  img.src=src;
  sl.querySelector('.plus').style.display='none';
  let del=sl.querySelector('.del-btn');
  if(!del){
    del=document.createElement('div');del.className='del-btn';del.innerHTML='×';
    del.onclick=e=>{e.preventDefault();e.stopPropagation();photos[idx]=null;img.remove();del.remove();sl.querySelector('.plus').style.display='';updateSlots();};
    sl.appendChild(del);
  }
  updateSlots();
}

function updateSlots(){
  let next=-1;
  for(let i=0;i<4;i++){
    const sl=document.getElementById('slot-'+i);
    if(!photos[i]&&next===-1)next=i;
    sl.style.display=(photos[i]||i===next)?'flex':'none';
  }
}

function addEntry(data){
  const list=document.getElementById('log-list');
  const div=document.createElement('div');div.className='log-entry';
  const d=data?data.date:today();
  div.innerHTML=`
    <button class="del-entry" onclick="this.closest('.log-entry').remove()">×</button>
    <div class="log-row" style="padding-right:28px">
      <div>
        <div class="log-field-label">วันที่</div>
        <input class="log-text" value="${d}" placeholder="DD/MM/YYYY" style="font-family:'IBM Plex Mono',monospace;font-size:13px">
      </div>
      <div>
        <div class="log-field-label">ช่าง</div>
        <div class="select-wrap">
          <select class="log-select">
            <option value="">เลือกช่าง</option>
            ${STAFF.map(s=>`<option ${s===(data&&data.staff)?'selected':''}>${s}</option>`).join('')}
          </select>
        </div>
      </div>
    </div>
    <div class="log-row">
      <div>
        <div class="log-field-label">งานที่ทำ</div>
        <div class="select-wrap">
          <select class="log-select">
            <option value="">เลือกงาน</option>
            ${TASKS.map(t=>`<option ${t===(data&&data.task)?'selected':''}>${t}</option>`).join('')}
          </select>
        </div>
      </div>
      <div>
        <div class="log-field-label">หมายเหตุ</div>
        <input class="log-text" value="${data?data.note||'':''}" placeholder="เช่น ข้างขวา">
      </div>
    </div>
    <div class="log-row">
      <div>
        <div class="log-field-label">ชั่วโมง</div>
        <input class="log-num" type="number" inputmode="numeric" min="0" max="24" value="${data?data.hours||'':''}" placeholder="0">
        <div class="time-unit">ชม.</div>
      </div>
      <div>
        <div class="log-field-label">นาที</div>
        <input class="log-num" type="number" inputmode="numeric" min="0" max="59" step="5" value="${data?data.mins||'':''}" placeholder="0">
        <div class="time-unit">น.</div>
      </div>
    </div>`;
  list.appendChild(div);
}

function getEntries(){
  return Array.from(document.querySelectorAll('.log-entry')).map(div=>{
    const ins=div.querySelectorAll('input,select');
    return {date:ins[0].value,staff:ins[1].value,task:ins[2].value,note:ins[3].value,hours:parseInt(ins[4].value)||0,mins:parseInt(ins[5].value)||0};
  });
}

function fmtTime(totalMin){
  const h=Math.floor(totalMin/60),m=totalMin%60;
  return h>0&&m>0?`${h} ชม. ${m} น.`:h>0?`${h} ชม.`:`${m} น.`;
}

async function syncToSheets(order){
  try{
    const payload={
      order_name:order.name,
      photos_count:(order.photos||[]).filter(Boolean).length,
      logs:(order.logs||[]).map(l=>({painter:l.staff||'',work_type:l.task||'',note:l.note||'',hours:l.hours||0,minutes:l.mins||0}))
    };
    await fetch(SHEET_URL,{method:'POST',body:JSON.stringify(payload)});
  }catch(e){console.log('sync error',e);}
}

function saveOrder(){
  const name=document.getElementById('order-name').value.trim();
  if(!name){alert('กรุณาใส่ชื่อออเดอร์');return;}
  const logs=getEntries();
  const btn=document.getElementById('save-btn');
  btn.textContent='กำลังบันทึก...';btn.disabled=true;
  if(currentId){
    const idx=orders.findIndex(x=>x.id===currentId);
    if(idx>-1)orders[idx]={...orders[idx],name,photos:[...photos],logs};
    syncToSheets(orders.find(x=>x.id===currentId)).then(()=>{btn.textContent='บันทึก';btn.disabled=false;saveOrders();showDetail(currentId);});
  } else {
    orders.unshift({id:'o'+Date.now(),name,photos:[...photos],logs,done:false,created:today()});
    currentId=orders[0].id;
    syncToSheets(orders[0]).then(()=>{btn.textContent='บันทึก';btn.disabled=false;saveOrders();showDetail(currentId);});
  }
}

function toggleDone(){
  const o=orders.find(x=>x.id===currentId);if(!o)return;
  o.done=!o.done;saveOrders();showDetail(currentId);
}

function showDetail(id){
  currentId=id;
  const o=orders.find(x=>x.id===id);if(!o)return;
  document.getElementById('detail-name').textContent=o.name||'ออเดอร์ไม่มีชื่อ';
  const dp=document.getElementById('detail-photos');
  const pics=(o.photos||[]).filter(Boolean);
  dp.innerHTML=pics.map(p=>`<img src="${p}">`).join('');
  dp.style.display=pics.length?'grid':'none';
  document.getElementById('done-badge-area').innerHTML=o.done?'<div class="done-badge">✓ เสร็จแล้ว</div>':'';
  let totalMin=0;
  document.getElementById('detail-logs').innerHTML=(o.logs||[]).map(l=>{
    const m=(parseInt(l.hours)||0)*60+(parseInt(l.mins)||0);
    totalMin+=m;
    return `<div class="log-row-detail">
      <div class="log-info">
        <div class="log-date-txt">${l.date}</div>
        <div class="log-main-txt"><span class="tag">${l.staff}</span>${l.task}${l.note?' · '+l.note:''}</div>
      </div>
      <div class="log-hrs">${fmtTime(m)}</div>
    </div>`;
  }).join('');
  document.getElementById('detail-total').textContent=fmtTime(totalMin);
  const btn=document.getElementById('btn-done-toggle');
  btn.textContent=o.done?'↩ เปิดออเดอร์อีกครั้ง':'✓ งานนี้เสร็จแล้ว';
  btn.className='btn-done'+(o.done?' done-active':'');
  show('detail');
}

function goHome(){show('home');renderHome();}
function show(v){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+v).classList.add('active');
}

loadOrders();
</script>
